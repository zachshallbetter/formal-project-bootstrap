name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Regenerate context
        run: python scripts/gen-context.py
      - name: Verify repository
        run: python scripts/check-all.py
      - name: Ensure generation is clean
        # The lock's validity basis is the aggregate source digest; its
        # repositoryState is provenance (the commit it was generated at), which a
        # committed lock can never match. Compare the corpora and the digest.
        run: |
          git diff --exit-code -- .agents/llms.txt .agents/llms-full.txt VERSION PROJECT_PROFILE_TEMPLATE.json
          python - <<'PY'
          import json, subprocess
          committed = json.loads(subprocess.check_output(["git", "show", "HEAD:.agents/context-lock.json"]))
          current = json.load(open(".agents/context-lock.json"))
          key = "aggregateSourceDigest"
          assert committed[key] == current[key], f"context-lock {key} changed: {committed[key]} -> {current[key]}"
          print("context-lock source digest unchanged:", current[key])
          PY
      - name: Upload release candidate
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: formal-project-bootstrap-${{ github.sha }}
          path: dist/
