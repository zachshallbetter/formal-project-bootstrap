name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Regenerate context
        run: python scripts/gen-context.py
      - name: Verify repository
        run: python scripts/check-all.py
      - name: Ensure generation is clean
        run: git diff --exit-code -- .agents VERSION PROJECT_PROFILE_TEMPLATE.json
      - name: Upload release candidate
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: formal-project-bootstrap-${{ github.sha }}
          path: dist/
